[package]
name = "charactermap"
version = "1.1.0+1"
edition = "2024"
description = "A simple character map."
license = "MIT"
repository = "https://github.com/XRayAdams/charactermap"
copyright = "2026 Konstantin Adamov <xrayadamo@gmail.com>"
homepage = "https://github.com/XRayAdams/charactermap"
keywords = ["carh", "fonts", "characters", "charmap"]
categories = ["gui","utils"]
authors = ["Konstantin Adamov <xrayadamo@gmail.com>"]



[dependencies]
relm4 = { version = "0.11.0", features = ["libadwaita"] }
relm4-macros = { version = "0.11.0"}
relm4-components = "0.11.0"

gtk4 = { version = "0.11.3", features = ["v4_12"] }
libadwaita = { version = "0.9.1", features = ["v1_5"] }
clap = { version = "4.5", features = ["derive"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
